name: Build Lisaan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip Lisaan_Source_v1_0_1.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android
        working-directory: source/lisaan_flutter_v10
        run: |
          flutter create . --platforms=android --org com.lisaan.app --project-name lisaan

      - name: Install dependencies
        working-directory: source/lisaan_flutter_v10
        run: flutter pub get

      - name: Build APK
        working-directory: source/lisaan_flutter_v10
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lisaan-release-apk
          path: source/lisaan_flutter_v10/build/app/outputs/flutter-apk/app-release.apk
