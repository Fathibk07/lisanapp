name: Build Lisaan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip Lisaan_Source_v1_0_1.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android
        working-directory: source/lisaan_flutter_v10
        run: |
          flutter create . --platforms=android --org com.lisaan.app --project-name lisaan

      - name: Set Android SDK 36
        working-directory: source/lisaan_flutter_v10
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for path in files:
              if path.exists():
                  text = path.read_text()
                  text = text.replace(
                      "flutter.compileSdkVersion", "36"
                  )
                  text = text.replace(
                      "compileSdkVersion 34", "compileSdkVersion 36"
                  )
                  text = text.replace(
                      "compileSdk = 34", "compileSdk = 36"
                  )
                  path.write_text(text)
                  found = True
                  print(f"Updated {path}")

          if not found:
              raise SystemExit("Android app Gradle file not found")
          PY

      - name: Install dependencies
        working-directory: source/lisaan_flutter_v10
        run: flutter pub get

      - name: Build APK
        working-directory: source/lisaan_flutter_v10
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lisaan-release-apk
          path: source/lisaan_flutter_v10/build/app/outputs/flutter-apk/app-release.apk
